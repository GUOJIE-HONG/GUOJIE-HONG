<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
  <title id="t">JACOB HONG — Character Sheet</title>
  <desc id="d">Pixel-art RPG character card: level, class, stat bars and a blinking PRESS START.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#1a1033"/><rect width="2" height="2" fill="#2a1d4d"/></pattern>
    <pattern id="stars" width="160" height="120" patternUnits="userSpaceOnUse">
      <rect x="20" y="14" width="3" height="3" fill="#ffd23f"/><rect x="90" y="40" width="2" height="2" fill="#f8f8f2"/><rect x="140" y="90" width="3" height="3" fill="#4dd9ff"/><rect x="55" y="100" width="2" height="2" fill="#f8f8f2"/>
    </pattern>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      .blink{animation:blink 1s steps(1) infinite}
      .bob{animation:bob 1.6s steps(2) infinite}
      @media (prefers-reduced-motion: reduce){ .blink,.bob{animation:none} }
    </style>
  </defs>

  <rect width="1200" height="480" fill="url(#grid)"/>
  <rect width="1200" height="480" fill="url(#stars)"/>

  <!-- outer pixel frame -->
  <rect x="18" y="18" width="1164" height="444" fill="none" stroke="#f8f8f2" stroke-width="4"/>
  <rect x="28" y="28" width="1144" height="424" fill="none" stroke="#ffd23f" stroke-width="2"/>
  <rect x="18" y="18" width="12" height="12" fill="#ffd23f"/><rect x="1170" y="18" width="12" height="12" fill="#ffd23f"/><rect x="18" y="450" width="12" height="12" fill="#ffd23f"/><rect x="1170" y="450" width="12" height="12" fill="#ffd23f"/>

  <g font-family="'Courier New',Consolas,monospace" font-weight="bold">
    <!-- header strip -->
    <rect x="28" y="28" width="1144" height="44" fill="#ffd23f"/>
    <text x="52" y="58" fill="#1a1033" font-size="20" letter-spacing="4">CHARACTER SHEET</text>
    <text x="1148" y="58" text-anchor="end" fill="#1a1033" font-size="20" letter-spacing="2">PLAYER 1</text>

    <!-- portrait -->
    <g transform="translate(64 104)">
      <rect width="176" height="176" fill="#0f0a22" stroke="#4dd9ff" stroke-width="4"/>
      <g class="bob" transform="translate(40 32)" fill="#ffd23f">
        <!-- pixel lightning -->
        <rect x="52" y="0" width="16" height="16"/><rect x="36" y="16" width="32" height="16"/><rect x="20" y="32" width="32" height="16"/>
        <rect x="4" y="48" width="48" height="16"/><rect x="28" y="64" width="40" height="16"/><rect x="52" y="80" width="32" height="16"/>
        <rect x="40" y="96" width="32" height="16"/><rect x="28" y="112" width="24" height="16"/>
        <rect x="52" y="0" width="16" height="16" fill="#fff5c2"/><rect x="36" y="16" width="8" height="16" fill="#fff5c2"/>
      </g>
      <rect x="0" y="176" width="176" height="28" fill="#4dd9ff"/>
      <text x="88" y="196" text-anchor="middle" fill="#1a1033" font-size="14" letter-spacing="3">.NET DEV</text>
    </g>

    <!-- name & class -->
    <text x="280" y="140" fill="#1a1033" font-size="54" letter-spacing="2" stroke="#1a1033" stroke-width="10">JACOB HONG</text>
    <text x="280" y="140" fill="#f8f8f2" font-size="54" letter-spacing="2">JACOB HONG</text>
    <text x="280" y="176" fill="#ffd23f" font-size="18" letter-spacing="3">LV.∞  ·  CLASS: C# / .NET DEVELOPER</text>
    <text x="280" y="204" fill="#b9a8e6" font-size="15" letter-spacing="1">"Give me more power."</text>

    <!-- stat bars -->
    <g transform="translate(280 236)" font-size="15" letter-spacing="2">
      <g>
        <text x="0" y="16" fill="#f8f8f2">HP  BUILD</text>
        <rect x="160" y="2" width="420" height="18" fill="#0f0a22" stroke="#f8f8f2" stroke-width="2"/>
        <rect x="163" y="5" width="0" height="12" fill="#ff4d6d"><animate attributeName="width" to="392" begin="0.3s" dur="1.2s" fill="freeze" calcMode="discrete" values="0;56;112;168;224;280;336;392" keyTimes="0;.14;.28;.42;.57;.71;.85;1"/></rect>
        <text x="598" y="16" fill="#ff4d6d">94/100</text>
      </g>
      <g transform="translate(0 32)">
        <text x="0" y="16" fill="#f8f8f2">MP  LEARN</text>
        <rect x="160" y="2" width="420" height="18" fill="#0f0a22" stroke="#f8f8f2" stroke-width="2"/>
        <rect x="163" y="5" width="0" height="12" fill="#4dd9ff"><animate attributeName="width" to="414" begin="0.6s" dur="1.2s" fill="freeze" calcMode="discrete" values="0;60;120;180;240;300;360;414" keyTimes="0;.14;.28;.42;.57;.71;.85;1"/></rect>
        <text x="598" y="16" fill="#4dd9ff">MAX</text>
      </g>
      <g transform="translate(0 64)">
        <text x="0" y="16" fill="#f8f8f2">XP  LEVEL UP</text>
        <rect x="160" y="2" width="420" height="18" fill="#0f0a22" stroke="#f8f8f2" stroke-width="2"/>
        <rect x="163" y="5" width="0" height="12" fill="#ffd23f"><animate attributeName="width" to="300" begin="0.9s" dur="1.2s" fill="freeze" calcMode="discrete" values="0;44;88;132;176;220;264;300" keyTimes="0;.14;.28;.42;.57;.71;.85;1"/></rect>
        <text x="598" y="16" fill="#ffd23f">72%</text>
      </g>
    </g>

    <!-- equipment chips -->
    <g transform="translate(280 352)" font-size="13" letter-spacing="2">
      <rect width="86" height="30" fill="#7c5cff"/><text x="43" y="20" text-anchor="middle" fill="#f8f8f2">C#</text>
      <rect x="96" width="170" height="30" fill="#7c5cff"/><text x="181" y="20" text-anchor="middle" fill="#f8f8f2">ASP.NET CORE</text>
      <rect x="276" width="112" height="30" fill="#7c5cff"/><text x="332" y="20" text-anchor="middle" fill="#f8f8f2">EF CORE</text>
      <rect x="398" width="150" height="30" fill="#7c5cff"/><text x="473" y="20" text-anchor="middle" fill="#f8f8f2">SQL SERVER</text>
    </g>

    <!-- right panel: quest -->
    <g transform="translate(900 104)">
      <rect width="236" height="278" fill="#0f0a22" stroke="#ff4d6d" stroke-width="4"/>
      <rect width="236" height="32" fill="#ff4d6d"/>
      <text x="118" y="22" text-anchor="middle" fill="#1a1033" font-size="14" letter-spacing="3">ACTIVE QUESTS</text>
      <g font-size="13" fill="#f8f8f2" letter-spacing="1">
        <text x="18" y="68">▶ CLEAN ARCH</text>
        <text x="18" y="104">▶ DDD</text>
        <text x="18" y="140">▶ SPEC-DRIVEN</text>
        <text x="18" y="176">▶ AGENTIC CODE</text>
      </g>
      <g font-size="11" fill="#b9a8e6" letter-spacing="1">
        <text x="18" y="86">in progress</text><text x="18" y="122">in progress</text><text x="18" y="158">in progress</text><text x="18" y="194">in progress</text>
      </g>
      <text x="118" y="250" text-anchor="middle" fill="#ffd23f" font-size="13" letter-spacing="3" class="blink">▶ PRESS START</text>
    </g>

    <!-- footer -->
    <rect x="28" y="408" width="1144" height="44" fill="#0f0a22"/>
    <line x1="28" y1="408" x2="1172" y2="408" stroke="#ffd23f" stroke-width="2"/>
    <text x="600" y="437" text-anchor="middle" fill="#f8f8f2" font-size="14" letter-spacing="6">BUILD · LEARN · LEVEL UP</text>
  </g>
</svg>
